name: Validate Shadow Hand materialization

on:
  pull_request:
    paths:
      - 'thirdparty/hakoniwa-mbody-registry'
      - 'examples/actuators/shadow_hand/prepare-model.bash'
      - 'examples/actuators/shadow_hand/README.md'
      - '.github/workflows/validate-shadow-hand-materialization.yml'

jobs:
  shadow-hand-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize mbody registry submodule
        run: git submodule update --init thirdparty/hakoniwa-mbody-registry

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML dependency
        run: python -m pip install PyYAML

      - name: Check preparation script syntax
        run: bash -n examples/actuators/shadow_hand/prepare-model.bash

      - name: Materialize Shadow Hand through mbody forge
        run: bash examples/actuators/shadow_hand/prepare-model.bash

      - name: Verify materialized model
        run: test -f thirdparty/hakoniwa-mbody-registry/bodies/shadow_hand/source/shadow_hand/scene_right.xml
