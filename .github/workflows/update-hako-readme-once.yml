name: update-hako-readme-once

on:
  push:
    branches:
      - agent/standard-hako-wrapper

permissions:
  contents: write

jobs:
  update-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/standard-hako-wrapper
      - name: Update README entry points
        shell: python
        run: |
          from pathlib import Path

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"expected block not found: {label}")
              return text.replace(old, new, 1)

          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          text = replace_required(text,
              '| Diagnose the local environment | [`./doctor.bash`](#environment-diagnostics) |',
              '| Diagnose the local environment | [`python tools/hako.py doctor`](#environment-diagnostics) |',
              'README start-here doctor')
          text = replace_required(text,
              '''git submodule update --init --recursive
./doctor.bash
./build.bash''',
              '''git submodule update --init --recursive
python tools/hako.py doctor
python tools/hako.py build''',
              'README setup commands')
          text = replace_required(text,
              '''Run this before `./build.bash` when setting up a new machine:

```bash
./doctor.bash
```

The doctor command checks local prerequisites without building:''',
              '''Use the OS-independent wrapper before building on a new machine:

```bash
python tools/hako.py doctor
```

`tools/hako.py` is the standard entry point used by higher-level Hakoniwa tooling. It keeps platform-specific implementation in this repository and delegates to the native scripts (`doctor.bash` on macOS/Linux and the existing PowerShell preflight on Windows).

The doctor command checks local prerequisites without building:''',
              'README diagnostics intro')
          text = replace_required(text,
              'Fix reported failures first, then run `./build.bash`.',
              'Fix reported failures first, then run `python tools/hako.py build`. Direct use of `doctor.bash`, `build.bash`, or `build-win.ps1` remains available for low-level debugging.',
              'README diagnostics conclusion')
          text = replace_required(text,
              '''PowerShell:

```powershell
.\\build-win.ps1 -Clean `
  -HakoniwaCoreRoot C:\\project\\hakoniwa-core-pro\\install `
  -HakoniwaPduEndpointRoot C:\\project\\hakoniwa-pdu-endpoint\\install `
  -ExtraPrefixPaths C:\\project\\vcpkg\\installed\\x64-windows
```''',
              '''Standard wrapper from PowerShell:

```powershell
python tools/hako.py doctor -- -HakoniwaCoreRoot C:\\project\\hakoniwa-core-pro\\install -HakoniwaPduEndpointRoot C:\\project\\hakoniwa-pdu-endpoint\\install -ExtraPrefixPaths C:\\project\\vcpkg\\installed\\x64-windows
python tools/hako.py build -- -HakoniwaCoreRoot C:\\project\\hakoniwa-core-pro\\install -HakoniwaPduEndpointRoot C:\\project\\hakoniwa-pdu-endpoint\\install -ExtraPrefixPaths C:\\project\\vcpkg\\installed\\x64-windows
```

For low-level Windows build debugging, `build-win.ps1` can still be invoked directly.''',
              'README Windows wrapper')
          text = replace_required(text,
              '''Run the environment doctor first:

```bash
./doctor.bash
```

Fix any `FAIL` lines, then run:

```bash
./build.bash
```''',
              '''Run the environment doctor through the standard wrapper first:

```bash
python tools/hako.py doctor
```

Fix any `FAIL` lines, then run:

```bash
python tools/hako.py build
```''',
              'README FAQ first command')
          text = text.replace('- For setup failures, include `./doctor.bash` output in the issue.', '- For setup failures, include `python tools/hako.py doctor` output in the issue.', 1)
          p.write_text(text, encoding='utf-8')

          p = Path('README-ja.md')
          text = p.read_text(encoding='utf-8')
          text = replace_required(text,
              '| ローカル環境を診断する | [`./doctor.bash`](#環境診断) |',
              '| ローカル環境を診断する | [`python tools/hako.py doctor`](#環境診断) |',
              'README-ja start-here doctor')
          text = replace_required(text,
              '''git submodule update --init --recursive
./doctor.bash
./build.bash''',
              '''git submodule update --init --recursive
python tools/hako.py doctor
python tools/hako.py build''',
              'README-ja setup commands')
          text = replace_required(text,
              '''新しい machine で setup する場合は、`./build.bash` の前に実行してください。

```bash
./doctor.bash
```

`doctor.bash` は build せずに、以下の前提を確認します。''',
              '''新しい machine で setup する場合は、OS 非依存の標準入口から診断してください。

```bash
python tools/hako.py doctor
```

`tools/hako.py` は上位の箱庭ツールから利用する標準入口です。OS 固有の実装はこのリポジトリ側に保持し、macOS/Linux では `doctor.bash`、Windows では既存 PowerShell preflight に委譲します。

doctor は build せずに、以下の前提を確認します。''',
              'README-ja diagnostics intro')
          text = replace_required(text,
              '表示された failure を解消してから `./build.bash` を実行してください。',
              '表示された failure を解消してから `python tools/hako.py build` を実行してください。`doctor.bash`、`build.bash`、`build-win.ps1` の直接実行は低レベルのデバッグ用途として引き続き利用できます。',
              'README-ja diagnostics conclusion')
          text = replace_required(text,
              '''PowerShell:

```powershell
.\\build-win.ps1 -Clean `
  -HakoniwaCoreRoot C:\\project\\hakoniwa-core-pro\\install `
  -HakoniwaPduEndpointRoot C:\\project\\hakoniwa-pdu-endpoint\\install `
  -ExtraPrefixPaths C:\\project\\vcpkg\\installed\\x64-windows
```''',
              '''PowerShell からの標準入口:

```powershell
python tools/hako.py doctor -- -HakoniwaCoreRoot C:\\project\\hakoniwa-core-pro\\install -HakoniwaPduEndpointRoot C:\\project\\hakoniwa-pdu-endpoint\\install -ExtraPrefixPaths C:\\project\\vcpkg\\installed\\x64-windows
python tools/hako.py build -- -HakoniwaCoreRoot C:\\project\\hakoniwa-core-pro\\install -HakoniwaPduEndpointRoot C:\\project\\hakoniwa-pdu-endpoint\\install -ExtraPrefixPaths C:\\project\\vcpkg\\installed\\x64-windows
```

Windows ビルドを低レベルでデバッグする場合は、`build-win.ps1` を直接実行できます。''',
              'README-ja Windows wrapper')
          p.write_text(text, encoding='utf-8')
      - name: Remove one-shot workflow
        run: rm .github/workflows/update-hako-readme-once.yml
      - name: Commit README updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md README-ja.md .github/workflows/update-hako-readme-once.yml
          git commit -m "Document standard hako.py workflow"
          git push origin HEAD:agent/standard-hako-wrapper
