id: generic-ackermann-model-forge
title: Generic Ackermann Golf Cart Model Forge
recipe_version: 1.0

runtime_dependencies:
  python:
    interpreter: work/foundation/install/python
    requirements: recipes/requirements/ackermann-forge.txt

goal:
  description: Reproduce the MuJoCo body consumed by the Generic Ackermann runtime.

ownership:
  hakoniwa-mbody-registry:
    owns:
      - structural and visual MJCF
      - mass, inertia, joints, and physical actuator parameters
      - collision primitives and contact exclusions
      - minimal MuJoCo validation world
      - generated model artifacts
  hakoniwa-mujoco-robots:
    owns:
      - asset manifest and runtime component bindings
      - PDU and endpoint definitions
      - Ackermann command conversion and controller mapping
      - Hakoniwa lifecycle and Launcher orchestration

dependencies:
  hakoniwa-mbody-registry:
    root:
      default_path: ../hakoniwa-mbody-registry
      override_env: HAKONIWA_MBODY_REGISTRY_ROOT
      relative_to: recipe_repository
    body: generic_ackermann_golf_cart

source_of_truth:
  directory: bodies/generic_ackermann_golf_cart/config
  files:
    - ackermann-forge.yaml
    - ackermann-tuning.yaml
    - model.xml
    - actuators.yaml
    - collision_primitives.yaml
    - contact_excludes.yaml
    - mujoco_world.yaml
    - provenance.yaml

generated_artifacts:
  owner: hakoniwa-mbody-registry
  directory: bodies/generic_ackermann_golf_cart/generated
  runtime_model: model.minimal_world.xml
  policy: Do not hand-edit generated MJCF; change config inputs and rerun Forge.

procedure:
  - order: 1
    action: Regenerate the model through the MBody-owned Forge.
    command: python3.12 tools/recipe/generic_ackermann.py forge
  - order: 2
    action: Rebuild in a temporary body tree and compare every generated artifact.
    command: python3.12 tools/recipe/generic_ackermann.py verify-forge
  - order: 3
    action: Run the shared, Recipe-scored headless Ackermann migration validation.
    command: python3.12 tools/recipe/generic_ackermann.py validate
  - order: 4
    action: Optionally search candidate actuator parameters without modifying source-of-truth YAML.
    command: python3.12 tools/recipe/generic_ackermann.py optimize
  - order: 5
    action: Build the downstream Hakoniwa asset.
    command: python3.12 tools/recipe/generic_ackermann.py build
  - order: 6
    action: Run the deterministic dynamic smoke test.
    command: python3.12 tools/recipe/generic_ackermann.py smoke

acceptance:
  automatic:
    - final MJCF loads in MuJoCo
    - vehicle remains stable without commands
    - straight command produces forward travel
    - left and right steering joints follow Ackermann targets
    - sustained steering produces a turn
    - both turn directions, wheel differential, numerical health, and headless RTF pass
  manual:
    - PS5 deadzone and control directions feel correct
    - steering and rendering are visually smooth
